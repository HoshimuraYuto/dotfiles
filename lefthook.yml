pre-commit:
  jobs:
    # The repository is public; block staged secrets and personal data before they are committed
    - name: secretlint
      file_types: [not symlink]
      run: npx --no -- secretlint --no-glob {staged_files}

    - name: sort-package-json
      glob: "package.json"
      run: npx --no -- sort-package-json {staged_files}
      stage_fixed: true

    - name: sort-json
      glob: "{claude/settings.json}"
      run: npx --no -- sort-json {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,json,yml,yaml,sh}"
      # Prettier refuses a symlink named on the command line; its target is checked on its own
      file_types: [not symlink]
      run: npx --no -- prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}
