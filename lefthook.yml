pre-commit:
  jobs:
    - name: sort-package-json
      glob: "package.json"
      run: npx --no -- sort-package-json {staged_files}
      stage_fixed: true

    - name: sort-json
      glob: "{claude/settings.json}"
      run: npx --no -- sort-json {staged_files}
      stage_fixed: true

    - name: prettier
      glob: "*.{md,json,yml,yaml,sh}"
      run: npx --no -- prettier --write {staged_files}
      stage_fixed: true

commit-msg:
  jobs:
    - name: commitlint
      run: npx --no -- commitlint --edit {1}
